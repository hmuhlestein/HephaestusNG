name: Feature Architect
description: >-
  Decomposes a design document into discrete, implementable features (aim
  for around 5, but the actual count follows the design's structure) before
  the per-feature pipelines run. Runs as its own workflow (see
  docs/LOOP_ENGINEERING_REVIEW.md) since it determines how many per-feature
  Workflow rows get created, so it can't be phase order=0 within one of them.

default_cli_tool: claude
default_model: sonnet
default_thinking_level: high
# pi removed as the secondary/fallback CLI tool -- falls through to
# hephaestus_config.yaml's agents.default_fallback_cli_tool, also unset.
# fallback_cli_tool:
# fallback_cli_model:

# Phase 0: Feature Architect decomposes the design into features, then
# Feature Review adversarially compares that decomposition back against the
# design document before any per-feature pipeline is launched.
execution_order: [1, 2]

session_roles:
  feature_architect: architect
  feature_review: feature_reviewer

orchestrator:
  type: evaluating
  max_phase_retries: 1
  max_total_gotos: 3
  evaluation_points:
    - after_phase: feature_architect
      evaluator: heuristic
      max_retries: 1
      conditions:
        - if: "score < 0.5"
          action: retry
          reason: "Feature decomposition incomplete or invalid"
        - if: "score >= 0.5"
          action: continue
          reason: "Feature decomposition validated"

    - after_phase: feature_review
      evaluator: heuristic
      max_retries: 2
      on_budget_exhausted: arbitrate
      conditions:
        - if: "score < 0.3"
          action: goto
          target: feature_architect
          reason: "Feature review found BLOCKER or FIX findings, re-decompose"
        - if: "score < 0.6"
          action: retry
          reason: "Feature review produced no result, retry the review"
        - if: "score >= 0.6"
          action: continue
          reason: "Feature decomposition matches the design"

workflow:
  result_criteria: "features.json created with valid feature decomposition and scope.md files for each feature, reviewed against the design"
  on_result_found: do_nothing
  enable_tickets: false

# Required output artifact per phase — the same completion hard floor every
# other pipeline phase gets (update_task_status rejects 'done' when the
# artifact is missing). Both phases write to .hephaestus/, since Phase 0's
# artifacts (Feature Architect's features.json/scope.md, feature_review's
# report) are internal orchestration state, never a git-tracked project
# deliverable, unlike the main autopilot pipeline's review reports
# (architectural_review, adversarial_review) which live in docs/.
# feature_architect's features.json/scope.md stay flat in .hephaestus/ (it
# runs first, before any per-phase convention applies); feature_review
# writes to its own .hephaestus/feature_review/ subdirectory, the same
# convention every other gated phase uses (Phase 2 §4.9 follow-up --
# feature_review used to be the one phase-scoped exception, sharing a
# flat .hephaestus/review.md that collided in name with
# architectural_review's own review.md; normalized to close both gaps).
required_output:
  feature_architect: features.json
  feature_review: feature_review.md

launch_template:
  parameters:
    - name: design_document
      label: Design Document Path
      type: text
      required: true
      description: "Path to the design document (PRD, DESIGN.md, etc.)"
    - name: project_path
      label: Project Working Directory
      type: text
      required: true
      description: "Where the project lives"
    - name: design_id
      label: Design ID
      type: text
      required: true
      description: "Database ID of the design being processed"
