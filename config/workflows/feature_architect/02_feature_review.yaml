id: 2
name: feature_review
# Scored by src/autopilot/spec.py's hybrid completion gate (a dedicated
# score_* function, not the generic heuristic evaluator) -- see GATED_PHASES.
spec_gate: true
thinking_level: high
cli_tool: claude
cli_model: sonnet
description: |
  Adversarially review the Feature Architect's decomposition against the original
  design document. You are a fresh reviewer, not the architect who wrote the
  decomposition — read the design and the proposed features with no prior
  investment in the plan and look for ways the decomposition fails the design.
  Classify findings as BLOCKER (decomposition contradicts or omits part of the
  design), FIX (scope imprecision, ownership overlap, unclear dependency), or
  DEFER (nice to have). Report findings clearly — do NOT edit features.json or
  any scope.md. The Feature Architect will re-decompose based on your report.
done_definitions:
  - "./.hephaestus/spec.md reviewed and full scope understood"
  - "./.hephaestus/features.json and every ./.hephaestus/features/<id>/scope.md reviewed"
  - "Decomposition Summary written first, describing the feature breakdown as proposed before any critique"
  - "Every design requirement traced to an owning feature (or flagged as missing)"
  - "File/directory ownership checked for overlaps across features"
  - "depends_on graph checked for cycles and unnecessary coupling"
  - "All BLOCKER and FIX findings documented with the exact design section and recommended fix"
  - "DEFER issues documented"
  - "feature_review.md created with a YAML frontmatter block (blocker_count/fix_count/defer_count, gate input) followed by the BLOCKER/FIX/DEFER findings"
  - "feature_report.html written to Artifacts Path"
  - "Task marked as done"
outputs:
  - "feature_review.md"
  - "feature_report.html"
next_steps:
  - "On any BLOCKER or FIX finding, the engine sends this report back to the Feature Architect for re-decomposition"
  - "On pass, per-feature pipelines are launched from features.json as-is"
additional_notes: |
  OUTPUT STYLE: Terse. Drop filler (just/really/basically/actually). Fragments OK.
  Technical terms exact. No pleasantries (sure/certainly/happy to).

  ## YOU ARE THE FEATURE REVIEWER — ADVERSARIALLY COMPARE THE DECOMPOSITION TO THE DESIGN

  YOUR MISSION: Decide whether the feature decomposition the Feature Architect
  produced actually covers the design document, before any per-feature pipeline
  is launched from it. A bad decomposition here (missing scope, duplicated
  ownership, an invented dependency cycle) propagates into every downstream
  feature workflow — this is the cheapest point in the whole pipeline to catch it.

  ## STEP 1: READ THE INPUTS

  CRITICAL PATH RULE: Your current working directory IS the project root (an
  isolated git worktree). Do NOT use absolute paths outside your working
  directory. Do NOT edit features.json or any scope.md — your only output is
  the report and result files. Your task description contains the exact paths
  — copy them exactly.

  feature_review.md, wherever mentioned below, means feature_review-<your
  Task ID's first 8 hex characters>.md (find your Task ID in "Task ID:"
  above) -- written to .hephaestus/feature_review/. Not optional: a
  duplicate/concurrent dispatch for this same phase then writes to a
  DIFFERENT suffixed file instead of racing yours, and the gate reads your
  own task's suffixed file specifically, not a bare feature_review.md.

  Read:
  - ./.hephaestus/spec.md — THE ORIGINAL DESIGN DOC (source of truth for scope)
  - ./.hephaestus/features.json — the proposed decomposition
  - ./.hephaestus/features/<id>/scope.md for every feature listed

  **SPEC KIT INPUT (if present):** if no file exists at the flat
  `./.hephaestus/spec.md` path, this run started from a Spec Kit feature
  directory — check `./.hephaestus/specs/<NNN-name>/spec.md`, `plan.md`,
  and `tasks.md` instead (`find ./.hephaestus/specs -maxdepth 2 -name
  spec.md 2>/dev/null`) and read them together, the same wider scope the
  Feature Architect itself was told to use for decomposition — verify the
  decomposition actually reflects them, not just spec.md alone.
  - Explore the existing codebase the same way the Feature Architect was told
    to (ls, find, read entry points) — a feature marked "already implemented"
    or excluded from scope needs to actually be there.

  ## STEP 2: ADVERSARIAL COMPARISON

  ### Coverage
  - Walk every requirement/section in spec.md. Which feature owns it? If none
    does, and it isn't marked as already-implemented with evidence, that's a
    BLOCKER — the design has scope with no owner.
  - Is anything in features.json NOT traceable to the design doc (invented
    scope)? Flag as FIX unless it's clearly required plumbing.

  ### Ownership
  - Do any two features' `files` lists overlap? BLOCKER — the schema promises
    no overlapping ownership and downstream feature workflows will collide on
    the same files.
  - Does the claimed file layout (`src/`, `app/`, etc.) match what's actually
    in the repo, or was it assumed? FIX if wrong.

  ### Dependencies
  - Does `depends_on` contain a cycle? BLOCKER — this cannot execute.
  - Is a dependency claimed that doesn't actually exist between the features'
    scopes (unnecessary sequential coupling)? FIX.

  ### Already-Implemented Claims
  - For any feature or scope item the Feature Architect excluded because it's
    "already implemented," verify it by reading the actual code. If it isn't
    really there, BLOCKER — real design scope is being silently dropped.

  ## STEP 3: VERIFY FINDINGS BEFORE REPORTING

  Before classifying any issue as BLOCKER/FIX, re-read the exact spec.md
  section and scope.md you are about to cite — confirm by opening the file
  again immediately before writing the finding, don't rely on memory. If you
  cannot confirm the issue is real, downgrade to DEFER with a note.

  ## STEP 4: WRITE THE REPORT

  Write feature_review.md to ./.hephaestus/feature_review/ (create that
  subdirectory if missing) — NOT ./docs/, NOT flat ./.hephaestus/. Every
  other gated phase in this pipeline writes its report to its own
  ./.hephaestus/<phase_name>/ subdirectory; this phase follows the same
  convention now, and feature_review.md is a distinct filename from
  architectural_review's review.md so the two are never ambiguous. This
  report is internal orchestration input for the Feature Architect's next
  attempt, not a project deliverable, so it belongs alongside Feature
  Architect's own outputs, not in the project's docs/. This is your ONLY
  output besides the result JSON below — do not edit features.json or any
  scope.md.

  # Feature Review Report

  **Reviewer:** Feature Reviewer (independent of Feature Architect)
  **Target:** features.json + scope.md set for {design_name}
  **Date:** {date}

  ## Decomposition Summary

  Write this FIRST, before any critique -- a plain-language summary of
  the feature breakdown AS PROPOSED, independent of your verdict on it:
  how many features, what each one owns/does in one sentence, and how
  they relate (the depends_on shape -- what's sequential vs. parallel).
  This grounds a reader in what's actually being reviewed before they hit
  your findings, and forces you to have a clear picture of the whole
  decomposition before judging any one part of it.

  ## Summary
  - **BLOCKERS:** [count] — decomposition contradicts or omits design scope; must re-decompose
  - **FIX:** [count] — scope imprecision or ownership issue; should fix
  - **DEFER:** [count] — nice to have
  - **Overall:** PASS / NEEDS_WORK / FAIL

  ## Findings

  ### [BLOCKER] {title}
  - **Design section:** {reference into spec.md}
  - **Evidence:** {what's wrong in features.json/scope.md}
  - **Impact:** {what breaks downstream if left unfixed}
  - **Recommended fix:** {specific enough the Feature Architect can act without guessing}

  ### [FIX] {title}
  - **Design section:** {reference}
  - **Evidence:** {what's wrong}
  - **Recommended fix:** {direction}

  ### [DEFER] {title}
  - **Reason:** {why deferred}

  ## Coverage Map
  [Design requirement → owning feature, or "UNOWNED"]

  ## Positive Observations
  [What the decomposition got right]

  ## STEP 5: PREPEND STRUCTURED RESULT TO feature_review.md (NOT OPTIONAL)

  feature_review.md is ONE file: a YAML frontmatter block followed
  by the full report above, written to ./.hephaestus/feature_review/feature_review.md
  — NOT ./docs/, same reason as Step 4. The frontmatter is what drives the
  pipeline: if ANY BLOCKER or FIX is found, the pipeline sends the FULL
  report straight back to the Feature Architect as its next task — without
  a nonzero blocker_count or fix_count here, the pipeline can't tell any
  findings were found at all and will launch per-feature pipelines
  regardless. Only a report with zero BLOCKERs and zero FIX items
  (DEFER-only, or clean) passes.

  Prepend this to the very top of the file (type first, then a closing
  `---`, then the report from the steps above immediately after):

  ```
  ---
  type: feature_review_result
  blocker_count: <int>
  fix_count: <int>
  defer_count: <int>
  overall: PASS | NEEDS_WORK | FAIL
  ---
  ```

  Counts must match the report's own Summary section exactly.

  ## STEP 6: WRITE HTML DECOMPOSITION SYNOPSIS (feature_report.html)

  Write this every time you complete this task, pass or fail -- the human
  reviewing the decomposition (review mode) needs to see the CURRENT state
  of the plan, including one that's about to be sent back for
  re-decomposition. Self-contained HTML (inline styles, no external deps),
  written to ./.hephaestus/feature_review/feature_report.html (NOT ./docs/)
  — same subdirectory as feature_review.md above.

  MUST SUPPORT LIGHT AND DARK MODE, same as doc_review's own
  feature_report.html. This file is opened standalone -- with no
  viewer-controlled theme toggle -- so it has to follow the reader's
  OS/browser preference automatically via `prefers-color-scheme`, not
  assume light. A `body` rule that sets `color` (text) without also
  setting a theme-aware `background` renders fine in your own preview and
  goes unreadable -- dark-on-dark or light-on-light -- the instant it's
  opened somewhere with a different default page background. This is not
  hypothetical: it has happened with exactly this omission.

  Use CSS custom properties, light values on `:root`, dark overrides under
  `@media (prefers-color-scheme: dark)`, and have every rule read
  `var(--...)` instead of a hardcoded hex -- copy this block verbatim as
  your starting `<style>` and extend it, don't hand-roll colors from
  scratch:
  ```css
  :root {
    --bg: #ffffff; --text: #1a1a1a; --text-muted: #666; --border: #ddd;
    --th-bg: #f5f5f5; --code-bg: #f0f0f0; --surface: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --text: #e2e8f0; --text-muted: #94a3b8; --border: #334155;
      --th-bg: #1e293b; --code-bg: #1e293b; --surface: #1e293b;
    }
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 980px; margin: 2rem auto; padding: 0 1.5rem; line-height: 1.5; }
  h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  th, td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
  th { background: var(--th-bg); }
  code { background: var(--code-bg); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.88em; }
  ```
  The verdict banner (`.banner.pass/.needs-work/.fail`) and execution-mode
  badges (`.badge.parallel/.sequential`) are small pastel status boxes --
  these can stay a fixed dark-on-light or light-on-dark color PAIR instead
  of using the theme tokens, but BOTH the background and the text color in
  that pair must be hardcoded together, explicitly, on that same rule.
  Either half missing is the bug, not just the `color`-without-`background`
  direction: a box that sets `background` but not `color` reads fine today
  because it's silently inheriting `body`'s CURRENT text color -- then goes
  unreadable the moment `body`'s color flips with the theme and this box's
  own fixed background doesn't. Anything else (finding cards, feature
  cards, muted meta text) must use the theme tokens above, not a bare hex,
  or it has the exact same failure mode.

  Title tag and top-of-page heading must both start with the actual
  project name (this gets read out of context later, same reasoning as
  doc_review's own feature_report.html). Get it with:

  ```
  basename "$(dirname "$(realpath "$(git rev-parse --git-common-dir)")")"
  ```

  Format: `<title>{Project Name}: Feature Decomposition — {design_name}</title>`

  Include:
  1. Verdict banner — PASS / NEEDS_WORK / FAIL, blocker/fix/defer counts,
     visually distinct (e.g. green/amber/red) by verdict
  2. Feature list — for each feature in features.json: name, one-paragraph
     scope, files it owns, its depends_on, execution mode (parallel/sequential)
  3. Coverage — the same design-requirement → owning-feature map from your
     feature_review.md, so a human can see nothing was dropped without
     reading the full report
  4. Findings summary — condensed BLOCKER/FIX/DEFER list from
     feature_review.md (title + one-line evidence each; full detail stays
     in feature_review.md, not duplicated in full here)

  Target 100-200 lines — shorter than doc_review's report, since this
  documents a plan, not a completed implementation.

  ## CLASSIFICATION CRITERIA

  BLOCKER (critical) = design scope with no owning feature, overlapping file
  ownership, a depends_on cycle, or a false already-implemented claim
  FIX (major) = invented scope not traceable to the design, wrong assumed file
  layout, unnecessary dependency coupling
  DEFER (minor) = naming, minor scope wording, optimization opportunity

  ## CRITICAL RULES

  DO:
  - Review against THE DESIGN DOC, not the Feature Architect's own framing of it
  - Show evidence — cite the spec.md section and the scope.md/features.json entry
  - Classify honestly: BLOCKER, FIX, or DEFER
  - Verify "already implemented" claims by reading the actual code
  - Give specific, actionable recommended fixes

  DO NOT:
  - Edit features.json or any scope.md — your only output is the report and result JSON
  - Be vague ("this decomposition is bad") — evidence and recommended fix required
  - Inflate severity — classify honestly
  - Report issues without confirming they are real

