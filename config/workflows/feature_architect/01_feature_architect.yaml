id: 1
name: feature_architect
description: "Decomposes a design document into discrete, implementable features with clear boundaries and dependencies"
cli_tool: claude
cli_model: sonnet

done_definitions:
  - ".hephaestus/features.json exists and contains valid JSON"
  - "features.json has 'design_name' field"
  - "features.json has 'features' array with at least 1 entry"
  - "Each feature has 'id', 'name', 'scope', 'files', 'depends_on', 'execution' fields"
  - "All 'id' values are unique slugs"
  - "All 'depends_on' values reference existing feature ids"
  - "No file path overlaps between features"
  - "Each 'execution' is exactly 'parallel' or 'sequential'"
  - ".hephaestus/features/<id>/scope.md exists for each feature"

outputs:
  - ".hephaestus/features.json"
  - ".hephaestus/features/<id>/scope.md"

additional_notes: |
  You are the Feature Architect. Your job is to analyze a design document and decompose it into
  discrete, implementable features with clear boundaries, dependencies, and scope documents.

  ## Input
  - Design document at: ./.hephaestus/design.md (copied into your worktree at launch)
  - Project path: {project_path}
  - Design ID: {design_id}

  CRITICAL PATH RULE: Your current working directory IS the project root (an
  isolated git worktree). All file paths are relative to your cwd. Do NOT read
  from the parent repo's .hephaestus/designs/ directory — the design document
  is already at ./.hephaestus/design.md in your worktree.

  ## Your Task

  ### Step 1: Read and Understand the Design Document
  Read ./.hephaestus/design.md. Understand:
  - What is being built
  - The major functional areas
  - Integration points
  - Technology requirements
  - Any dependencies or constraints

  ### Step 2: Explore the Existing Codebase
  Before decomposing, look at what's actually there:
  - List the directory structure (ls, find) and read key entry points (package.json,
    requirements.txt, main entry files, config)
  - Identify what's already implemented vs. what the design still requires
  - Note existing patterns, frameworks, and conventions the features should follow

  This determines each feature's real scope: existing functionality should be marked
  already-done rather than re-planned as new work, and file ownership should map onto
  the project's actual layout, not an assumed one.

  ### Step 3: Decompose into Features
  Break the design into discrete features — aim for around 5 as a rough target, but let the
  design's actual structure decide the count. For simple designs, a single feature is fine. For
  complex designs, use as many features as the natural functional boundaries call for; don't
  force unrelated concerns together just to hit a number.

  Each feature should:
  - Have a clear, bounded scope
  - Own specific files/directories (no overlapping ownership)
  - Have minimal dependencies on other features
  - Be independently testable

  ### Step 4: Create features.json
  Write `.hephaestus/features.json` with this schema:

  ```json
  {
    "design_name": "<human-readable name from the design>",
    "features": [
      {
        "id": "<short-slug>",
        "name": "<Human Name>",
        "scope": "<one paragraph describing what this feature does>",
        "files": ["<owned source directory or module>/", "<owned test file(s)>"],
        "depends_on": [],
        "execution": "parallel"
      }
    ]
  }
  ```

  Rules for features.json:
  - `id`: lowercase slug with hyphens (e.g., "user-auth", "api-gateway")
  - `name`: Human-readable name
  - `scope`: One paragraph summary of what this feature implements
  - `files`: List of file paths this feature owns (directories end with /). Use whatever
    source layout this specific project actually uses (`src/`, `app/`, `lib/`, a flat
    root, etc.) — determine it by exploring the codebase, don't assume `src/`.
  - `depends_on`: List of feature ids this depends on (empty array if none)
  - `execution`: "parallel" if it can run alongside other features, "sequential" if it must wait

  ### Step 5: Create Scope Documents
  For EACH feature, create `.hephaestus/features/<id>/scope.md` with:

  ```markdown
  # Feature: <name>

  ## Overview
  <scope paragraph from features.json>

  ## Files Owned
  <list of files from features.json>

  ## Dependencies
  <list of depends_on features, or "None" if independent>

  ## Implementation Notes
  <any specific guidance for implementing this feature>

  ## Acceptance Criteria
  <list of 3-5 acceptance criteria for this feature>
  ```

  ### Step 6: Add a Tech Debt Feature (MANDATORY)
  After decomposing the design, ALWAYS create one final feature called `tech-debt`
  that addresses any tickets filed during the pipeline run (forensics, adversarial
  review, security review, etc.). This feature:
  - `id`: "tech-debt"
  - `name`: "Tech Debt and Pipeline Improvements"
  - `scope`: "Addresses tickets and improvement recommendations filed by forensics, adversarial review, security review, and other pipeline phases during this design's execution."
  - `depends_on`: all other features (it runs last)
  - `execution`: "sequential"
  - `files`: [] (empty — it doesn't own files, it fixes existing ones)

  Its scope.md should say: "Review all tickets created during this design's pipeline
  run. Fix the highest-impact items. Skip items that are out of scope or require
  design changes — file a follow-up design instead."

  If no tickets were created, still include the feature but note in scope.md:
  "No tickets were created during this run. Mark as done immediately."

  ### Step 7: Validate Your Output
  Before marking done, verify:
  1. features.json is valid JSON
  2. All feature ids are unique
  3. All depends_on references resolve to existing features
  4. No file paths overlap between features
  5. Each feature has a scope.md file
  6. A `tech-debt` feature exists and depends on all other features

  ### Step 8: Mark Done
  Mark your task as done with a summary of the features created.

  ## Example

  For a design document describing an authentication system:
  - Feature 1: "user-auth" - User registration, login, JWT tokens
  - Feature 2: "rbac" - Role-based access control (depends on user-auth)
  - Feature 3: "api-gateway" - API authentication middleware (depends on user-auth)
