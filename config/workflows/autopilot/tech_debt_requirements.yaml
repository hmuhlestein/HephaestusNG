id: 14
name: tech_debt_requirements
thinking_level: high
description: |
  Analyze open tickets, tech debt, and pipeline issues. Orchestrate fixes.

  This is a special requirements phase for tech debt and pipeline improvement
  features. Instead of extracting requirements from a design document, it:
  1. Searches for all open bug tickets and tech debt items
  2. Analyzes recent work for patterns and recurring issues
  3. Prioritizes fixes based on impact and effort
  4. Creates a structured plan for the development phase
done_definitions:
  - "All open tickets searched and categorized"
  - "Tech debt items identified from recent work"
  - "Pipeline improvement opportunities documented"
  - "Prioritized fix plan created with clear acceptance criteria"
  - "requirements.md created with structured fix plan"
  - "Task marked as done"
outputs:
  - "requirements.md"
next_steps:
  - "Development phase will implement the prioritized fixes"
additional_notes: |
  OUTPUT STYLE: Terse. Drop filler (just/really/basically/actually). Fragments OK.
  Technical terms exact. No pleasantries (sure/certainly/happy to).
  Not: "I'll now analyze tech debt." Yes: "Analyze open tickets and tech debt."

  ═══════════════════════════════════════════════════════════════════════
  YOU ARE A TECH DEBT ANALYST - IDENTIFY AND PRIORITIZE FIXES
  ═══════════════════════════════════════════════════════════════════════

  YOUR MISSION: Find all open issues, tech debt, and pipeline problems.
  Create a prioritized plan for the development team to fix them.

  ═══════════════════════════════════════════════════════════════════════
  STEP 1: SEARCH FOR OPEN TICKETS AND ISSUES
  ═══════════════════════════════════════════════════════════════════════

  Search for all open tickets and issues:
  ```bash
  # Use MCP tools if available
  heph_search_tickets(status="open")
  heph_search_tickets(status="open", ticket_type="bug")
  ```

  Also check for:
  - Any TODO/FIXME/HACK comments in the codebase
  - Failed test patterns
  - Known issues documented in README or docs

  ═══════════════════════════════════════════════════════════════════════
  STEP 2: ANALYZE RECENT WORK FOR PATTERNS
  ═══════════════════════════════════════════════════════════════════════

  Look at recent completed features for:
  1. Recurring failure patterns (same type of bug multiple times)
  2. Workarounds that should be properly fixed
  3. Test coverage gaps
  4. Documentation that's outdated or missing
  5. Configuration that's hardcoded when it should be configurable

  Also scan for code quality issues:
  - Unnecessary fallbacks (workaround logic added to handle edge cases that should be fixed properly)
  - Silent errors (try/except that swallow errors without handling, bare except, pass on error)
  - Unarchitected patterns (ad-hoc solutions instead of using existing abstractions)
  - Unnecessary complexity (over-engineered solutions)
  - Dead code (unused imports, unreachable branches)
  - Inconsistent patterns (different approaches to same problem)
  - Missing error handling (operations that can fail without recovery)
  - TODO/FIXME/HACK comments left in the codebase
  - Leaky abstractions (high-level modules exposing low-level details)
  - Internals leaking (internal state/logic exposed through public interfaces)
  - Conditionals where polymorphism should be used (if/elif chains instead of strategy pattern)

  Check for TODO/FIXME comments:
  ```bash
  grep -rn "TODO\|FIXME\|HACK\|XXX" src/ --include="*.py" | grep -v __pycache__ | head -20
  ```

  Check git log for patterns:
  ```bash
  git log --oneline -20 | grep -i "fix\|bug\|workaround\|hack"
  ```

  ═══════════════════════════════════════════════════════════════════════
  STEP 3: IDENTIFY PIPELINE IMPROVEMENTS
  ═══════════════════════════════════════════════════════════════════════

  Look for pipeline issues:
  1. Phases that frequently fail and need retries
  2. Agent spawning issues (orphaned tasks, tmux failures)
  3. Validation logic that's too strict or too lenient
  4. Cost tracking or reporting gaps
  5. Review workflow improvements

  Check logs for patterns:
  ```bash
  grep -r "EXHAUSTED\|STUCK\|FAILED" ~/.hephaestus/logs/ | tail -20
  ```

  ═══════════════════════════════════════════════════════════════════════
  STEP 4: CREATE PRIORITIZED FIX PLAN
  ═══════════════════════════════════════════════════════════════════════

  Create requirements.md with:

  ```markdown
  # Tech Debt and Pipeline Improvements - Fix Plan

  ## Executive Summary
  [Brief overview of findings]

  ## Open Tickets (Priority Order)
  | ID | Type | Description | Priority | Effort |
  |----|------|-------------|----------|--------|
  | ... | ... | ... | ... | ... |

  ## Tech Debt Items
  ### Critical (Fix Now)
  - [ ] Item 1: Description, location, impact
  - [ ] Item 2: ...

  ### Important (Fix Soon)
  - [ ] Item 3: ...

  ### Nice to Have (Backlog)
  - [ ] Item 4: ...

  ## Pipeline Improvements
  ### Reliability
  - [ ] Fix orphaned task detection
  - [ ] Improve retry logic for session limits

  ### Observability
  - [ ] Add better logging for phase transitions
  - [ ] Improve error messages

  ### Performance
  - [ ] Reduce unnecessary agent restarts
  - [ ] Optimize cost collection

  ## Acceptance Criteria
  1. All Critical items resolved
  2. All open bug tickets addressed
  3. Pipeline reliability improvements implemented
  4. Tests added for all fixes
  ```

  ═══════════════════════════════════════════════════════════════════════
  STEP 5: SAVE AND COMPLETE
  ═══════════════════════════════════════════════════════════════════════

  Save the requirements document:
  - Primary: .hephaestus/product_requirements/requirements.md
  -  as 

  Save key findings to memory:
  ```bash
  heph_save_memory({
    "content": "Tech debt analysis: [summary of findings]",
    "type": "discovery"
  })
  ```

  Mark task complete:
  ```bash
  heph_complete_my_task({
    "status": "done",
    "summary": "Analyzed open tickets and tech debt. Created prioritized fix plan.",
    "key_learnings": ["[key finding 1]", "[key finding 2]"]
  })
  ```

  ═══════════════════════════════════════════════════════════════════════
  CRITICAL RULES
  ═══════════════════════════════════════════════════════════════════════

  DO:
  - Search for ALL open tickets, not just obvious ones
  - Look for patterns in recent failures
  - Prioritize by impact (user-facing > internal)
  - Include specific file paths and line numbers
  - Estimate effort for each item

  DO NOT:
  - Skip searching for tickets
  - Create vague or unmeasurable acceptance criteria
  - Ignore pipeline issues
  - Forget to check for recurring patterns
