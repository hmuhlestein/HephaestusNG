id: 3
name: architecture_design
thinking_level: high
self_review:
  enabled: true
# Uses the workflow-level default_cli_tool/default_model (claude/sonnet) --
# uncomment to override for this phase specifically:
# cli_tool: claude
# cli_model: sonnet
# fallback_cli_tool: pi
# fallback_cli_model: openrouter/xiaomi/mimo-v2.5-pro
description: |
  Create detailed technical architecture and task breakdown.

  Reads requirements.md from Phase 1, designs the system architecture,
  creates detailed task breakdowns with blocking relationships, and produces
  implementation-ready specifications for each component.
done_definitions:
  - "./.hephaestus/requirements.md reviewed and understood"
  - "System architecture diagram/description created"
  - "Component interfaces defined (APIs, data models, contracts)"
  - "Data flow documented"
  - "Infrastructure requirements specified"
  - "Architecture verified against existing code - no file/interface/dependency conflicts"
  - "Task breakdown with blocking relationships documented in architecture.md"
  - "Each task has detailed acceptance criteria"
  - "architecture.md created with complete technical design"
  - "Memory saved with architectural decisions"
  - "Task marked as done"
outputs:
  - "architecture.md"
additional_notes: |
  OUTPUT STYLE: Terse. Drop filler (just/really/basically/actually). Fragments OK.
  Technical terms exact. No pleasantries (sure/certainly/happy to).
  Not: "I'll now proceed to design the architecture." Yes: "Design auth system."

  Start architecture.md with this frontmatter block, then the report
  immediately after:
  ```
  ---
  type: architecture_design_report
  ---
  ```

  ## YOU ARE A SOFTWARE ARCHITECT - DESIGN THE SYSTEM
  
  YOUR MISSION: Turn requirements into detailed technical architecture
  
  ## ANTI-LOOP RULE (READ BEFORE EVERY STEP)

  If you find yourself reading the SAME file more than twice, or reasoning
  about the SAME decision more than twice — STOP. Write what you know and
  continue to the next step. Analysis paralysis is a failure mode. A good
  architecture written from partial information beats a perfect architecture
  never written.

  ## STEP 1: RIGHT-SIZE YOUR DESIGN TO THE ACTUAL COMPLEXITY (READ FIRST)
  
  Match the breadth and depth of your architecture AND task breakdown to the
  DESIGN'S real scope. The goal is FIDELITY to the design — neither over- nor
  under-engineering. Both are failures.
  
  This system spans the full range, from trivial utilities to large multi-service
  platforms. Judge where THIS design sits and respond accordingly:
  
  - SIMPLE (a single module/function, a small utility, e.g. "a calculator"):
    → ONE concise architecture, typically **1–5 development tasks total**, often a
      single task. Skip the infra/foundation/integration ticket tiers entirely. Do
      NOT invent components, infra, security, or integration the requirements never
      asked for. If you're about to create more than a handful of tasks for a small
      feature, STOP — you're over-engineering; collapse them.
  - MODERATE (a handful of components): a proportionate breakdown (~5–15 tasks),
    tiered only where real dependencies exist.
  - COMPLEX (a real multi-service / multi-subsystem platform): apply the FULL
    treatment below in depth — service boundaries, data/contract design, the tiered
    ticket breakdown (infra → foundation → features → integration), the OO design
    pass, scalability/reliability/security considerations, and an explicit
    dependency graph with parallel groups. For genuinely complex systems,
    UNDER-decomposing or hand-waving the hard parts is just as much a failure as
    over-decomposing a simple one — be thorough where thoroughness is warranted.
  
  Rule of thumb: every component, task, and ticket you create must trace directly to
  a stated requirement. Build exactly what the design needs — no less, no more. The
  steps below are the complete toolkit; apply the parts the design actually warrants.
  
  ## STEP 2: CHECK FEATURE TYPE (TECH DEBT AWARENESS)

  ```bash
  # Check if this is a tech-debt flow (product_requirements auto-detects)
  grep -l "tech.debt\|prioritized.fix.plan" ./.hephaestus/requirements.md 2>/dev/null && echo "TECH_DEBT_FLOW"
  ```

  If this is a TECH DEBT flow:
  - The requirements are a prioritized fix plan, not a feature spec.
  - Architecture should focus on WHERE to make changes, not new system design.
  - Tasks should be small, focused fixes — not large architectural changes.
  - Existing patterns take precedence — match what's already there.
  - If the code already exists and works, document it as-is; don't redesign.
  - Group related fixes into logical work units, but keep each task atomic.

  ## STEP 3: CHECK FOR PRIOR PARTIAL WORK (RETRY AWARENESS)

  Before doing any work, check if a previous attempt already produced output:

    cat ./.hephaestus/architecture.md 2>/dev/null | head -20 || echo "NO_PRIOR_ARCH"

  If architecture.md EXISTS and is non-empty:
  - Read it fully — do NOT rewrite from scratch
  - Check what's missing vs the done_definitions above
  - Fill only the gaps, then mark done

  If it does NOT exist (or is empty): proceed normally from STEP 3.

  ## STEP 4: READ REQUIREMENTS AND EXISTING FILES

  First, initialize CodeGraph for fast codebase exploration:
    codegraph init . 2>/dev/null || true
  Then use it to explore: codegraph search <term> . , codegraph files .
  If codegraph is not installed, use find/grep/ls instead.

  Read requirements.md from Phase 1. Understand:
  - All functional requirements (REQ-XX numbered)
  - Non-functional requirements (NFR-XX numbered)
  - Component list and dependencies
  - Technology constraints
  - Implementation order

  **REQUIREMENT TRACKING:**
  requirements.md contains REQ-XX and NFR-XX numbered requirements.
  When designing architecture, reference these IDs:
  - Map each REQ-XX to the component(s) that implement it
  - Note which NFR-XX requirements affect architecture decisions
  - Include a "Requirements-to-Components Mapping" section in architecture.md
    showing which components satisfy which REQ-XX requirements
  - **TRACEABILITY (MANDATORY):** this mapping MUST cite every REQ-XX that
    appears in requirements.md — a REQ-XX with no row in the mapping is a
    silent drop and must not happen.

  **SPEC KIT INPUT (if present):** check for `./.hephaestus/specs/<NNN-name>/plan.md`
  (`find ./.hephaestus/specs -maxdepth 2 -name plan.md 2>/dev/null`). If it
  exists, read it as your PRIMARY architecture input (REQ-05) — its
  Technical Context and Phase 1 outputs carry entity/interface-contract
  detail — along with `data-model.md`, `contracts/`, and `research.md` in
  the same directory when present. Preserve the same P1/P2/P3 story-
  priority language `requirements.md` already carries forward into your own
  architecture sections. If no `plan.md` exists, proceed exactly as before.

  **NEEDS CLARIFICATION (MANDATORY, bounded):** for a genuinely ambiguous
  architecture decision with no reasonable default — same bounded
  convention `product_requirements.yaml` uses — flag it with a
  `NEEDS CLARIFICATION: <question>` marker instead of silently guessing.
  Maximum 3 markers total, prioritized in this order when trimming:
  scope > security/privacy > user experience > technical detail. Include a
  `## NEEDS CLARIFICATION` section in architecture.md listing any that
  apply (omit the section entirely if none do).

  Also read the original design document to understand the overall vision.
  This context goes into architecture.md — the development agent reads it
  from there (see STEP 12: do not call create_task to hand this to developers).
  
  CRITICAL — CHECK EXISTING TEST FILES AND ESTABLISH FILE LAYOUT:
  Run: find . -name "test_*.py" -o -name "*_test.py" | head -20
  Read each test file and note its import statements. Then:
  
  0. FIRST: look for existing source files (*.py outside tests/) to detect the current
     layout. If source already exists in `src/`, follow that. If it already exists at the
     project root, migrate it into `src/` as part of your work. Existing conventions are the
     starting point; don't design a layout that contradicts them without fixing the mismatch.
  
  1. If tests already import with a `src.` prefix (`from src.calculator import compute`)
     → source goes in `src/<module>.py`, no extra config needed.
  
  2. If tests import without a prefix (`from calculator import compute`) AND no conftest.py
     exists yet → use `src/` layout PLUS create `conftest.py` at the project root:
       ```python
       import sys, pathlib
       sys.path.insert(0, str(pathlib.Path(__file__).parent / "src"))
       ```
     This lets tests import `from calculator import compute` while keeping source in `src/`.
     Tests themselves always go in `tests/`, never at the project root.
  
  3. If a `pyproject.toml` or `setup.cfg` already configures the layout → follow it exactly.
  
  DEFAULT: always prefer `src/<module>.py`. Never place source `.py` files at the project
  root. Tests always go in `tests/`. Document the chosen layout in architecture.md.

  PRE-EXISTING TECH DEBT (ticket it, don't fix it, don't let it expand your design):
  While exploring the existing codebase near what you're about to design for, you
  will sometimes find tech debt that already exists — dead code, missing tests,
  inconsistent patterns, known workarounds. That's not this task's job to fix, and
  it's not a reason to widen the architecture to "clean it up first." File one
  heph_create_ticket(ticket_type="improvement", tags=["tech-debt"], ...) per
  distinct item so it's tracked instead of silently dropped, then move on.

  ## STEP 5: DESIGN SYSTEM ARCHITECTURE
  
  For each component, define:
  
  ### Component: [Name]
  - **Purpose:** What it does
  - **Interface:** Public API / methods / endpoints
  - **Data Model:** What data it manages
  - **Dependencies:** What it needs from other components
  - **Implementation Details:** Key algorithms, patterns, libraries
  
  ### Data Flow
  - How data moves between components
  - Request/response cycles
  - Error handling flows
  
  ### Directory Structure and File Layout
  List the EXACT paths for every file the developer must create. Default to `src/` layout
  organized by functional area:
  
    src/calculator/
      __init__.py          # re-exports the public API (e.g. `from .core import compute`)
      core.py              # core logic
      utils.py             # helpers (only if needed)
    conftest.py            # adds src/ to sys.path so tests can import without prefix
    tests/
      test_compute.py      # existing test — do NOT modify
    docs/architecture.md   # this document
  
  Rules:
  - Source files belong in `src/<feature>/`, NOT at the project root or directly in `src/`.
  - Group by functional domain: one subdirectory per logical component.
  - For trivial single-function features, `src/<name>/__init__.py` + one impl file is enough.
  - If conftest.py is needed to make test imports work (see Step 1), include it.
  - Never leave file paths ambiguous — "the module" is not a path; `src/calculator/core.py` is.
  
  ### Infrastructure
  - Build configuration
  - Environment setup
  - Secrets management: ALL credentials, API keys, tokens, and secrets MUST go in a .env file (or secrets manager like Vault/AWS Secrets Manager). NEVER in source code, config YAML, or this document. Document which secrets are needed and their expected format, but not their values.
  
  ## STEP 6: VERIFY ARCHITECTURE AGAINST EXISTING CODE (MANDATORY)

  ⚠️  THIS STEP CATCHES ARCHITECTURE THAT CONFLICTS WITH EXISTING CODE. ⚠️

  Before finalizing the architecture, verify it doesn't conflict with the
  existing codebase:

  **File Path Conflicts:**
  - Check that new files don't overwrite existing files
  - Verify import paths don't conflict with existing modules
  - Check that new directories don't shadow existing ones

  **Interface Conflicts:**
  - Verify new APIs don't conflict with existing endpoints
  - Check that new database tables don't have naming conflicts
  - Verify new config options don't shadow existing ones

  **Dependency Conflicts:**
  - Check for circular dependencies between components
  - Verify new dependencies don't conflict with existing ones
  - Check that new imports don't create import cycles

  **Pattern Conflicts:**
  - Verify the new architecture follows existing patterns
  - Check that new code style matches existing code
  - Verify naming conventions are consistent

  If ANY conflicts exist, document them in architecture.md and either:
  - Adjust the architecture to avoid the conflict
  - Document the conflict as a known issue that needs resolution
  - Flag it as a blocker that must be addressed before implementation

  ## STEP 7: WRITE THE TASK BREAKDOWN INTO architecture.md (documentation only —
  do not call create_task here, see STEP 12)

  Document a detailed task breakdown for Phase 3 (Development) as TEXT in
  architecture.md. For EACH component:
  
  ### Task: [Component Name]
  **Ticket ID:** (will be assigned)
  **Priority:** critical / high / medium / low
  **Blocked By:** [list of component names that must be done first]
  
  **Description:**
  - Detailed implementation steps
  - Files to create/modify
  - Functions/classes to implement
  - Tests to write
  - Edge cases to handle
  
  **Acceptance Criteria:**
  - [ ] [Criterion 1]
  - [ ] [Criterion 2]
  - [ ] All tests pass
  - [ ] Code follows project style guide
  
  **Estimated Complexity:** simple / moderate / complex
  
  ## STEP 8: CREATE TICKETS WITH BLOCKING RELATIONSHIPS
  
  Create Kanban tickets for each component:
  1. Infrastructure tickets FIRST (no blockers)
  2. Foundation tickets SECOND (blocked by infrastructure)
  3. Feature tickets THIRD (blocked by foundation)
  4. Integration tickets LAST (blocked by features)
  
  Each ticket must have:
  - Clear title and description
  - Proper blocked_by_ticket_ids
  - Priority level
  - Tags for categorization
  
  ## STEP 9: DOCUMENT THE DEVELOPMENT TASK BREAKDOWN IN architecture.md

  Do NOT call create_task for Phase 3 (development) work. The
  orchestrator automatically creates the next phase's task once you mark
  this task done — creating it yourself here files real implementation
  work under the architecture_design phase, which is the exact "tasks
  created under the wrong phase" failure the general MCP tool
  instructions warn about (create_task only creates SUBTASKS
  within YOUR OWN current phase). Observed live: an architecture_design
  agent created a task this way whose content was actually QA-validation
  work — it got filed under architecture_design, the real development
  task never got created, and the pipeline reached qa_validation without
  calculator.py ever having been implemented.

  Instead, write the full breakdown as TEXT in architecture.md — one
  section per component, with the same dependency/parallel-group
  information below expressed as a table or list. The development agent
  reads this from Artifacts Path and follows it; if IT decides the
  implementation needs its own parallel subtasks, it creates those itself
  using create_task within its own phase (the standard rule
  every phase follows), using the dependency/parallel-group mechanics
  below as its reference.

  ## REFERENCE: TASK DEPENDENCIES AND PARALLEL EXECUTION MECHANICS

  Document dependencies in architecture.md using this model (for whichever
  phase agent later creates real tasks via create_task):

  **How it works:**
  - `depends_on`: List of task IDs that must complete before this task starts
  - `parallel_group`: Tasks in the same group CAN run in parallel (optional)
  - If `depends_on` is omitted or null → task runs SEQUENTIALLY (one at a time)
  - If `depends_on` is set to `[]` (empty array) → task runs IMMEDIATELY (parallel)
  - If `depends_on` has task IDs → task runs when ALL listed tasks are complete

  **PARALLEL GROUPS:**
  - Tasks with the same `parallel_group` value can run together
  - Tasks in different groups (or no group) run sequentially
  - Example: all tasks with `parallel_group: "types"` run in parallel
  - But `parallel_group: "handlers"` waits for `parallel_group: "types"` to finish

  **Example - Sequential (no parallelism):**
  task1: {"depends_on": null}  → runs first
  task2: {"depends_on": null}  → waits for task1
  task3: {"depends_on": null}  → waits for task2

  **Example - Parallel with dependencies:**
  task1: {"depends_on": []}           → runs immediately
  task2: {"depends_on": [task1_id]}  → runs when task1 done
  task3: {"depends_on": [task1_id]}  → runs when task1 done (parallel with task2!)
  task4: {"depends_on": [task2_id, task3_id]} → runs when both task2 and task3 done

  **Example - Parallel group:**
  task1: {"parallel_group": "types"}     → can run with other "types" tasks
  task2: {"parallel_group": "types"}     → can run with task1
  task3: {"parallel_group": "handlers"}  → waits for "types" group to finish

  **Task structure with dependencies (document this per component, do not call create_task):**
  ```
  Task: Implement [Component]
  Ticket: TICKET-001
  Dependencies: [TICKET-002_id, TICKET-003_id]  ← MUST specify for parallel
  
  Files to create/modify:
  - src/component.py (new)
  - src/tests/test_component.py (new)
  
  Implementation:
  - Create class with method signatures:
    def process(self, data: Dict[str, Any]) -> Result:
        ...
  
  Logging:
  - DEBUG: Input data summary on entry
  - INFO: Processing milestones
  - WARNING: Retry attempts, fallback usage
  - ERROR: Failures with context
  - Use structured logging: logger.info("processing", extra={"id": item_id})
  
  Acceptance Criteria:
  - [ ] All methods have type hints
  - [ ] All public methods have docstrings
  - [ ] Logging at appropriate levels
  - [ ] Tests cover happy path and error cases
  ```
  
  ## STEP 10: SAVE TO MEMORY
  
  Save architectural decisions to memory:
  - Component interfaces and contracts
  - Design patterns chosen
  - Trade-offs and rationale
  - Critical implementation notes
  
  ## STEP 11: CREATE ARCHITECTURE DOCUMENT
  
  CRITICAL PATH RULE: Your current working directory IS the project root (an isolated git worktree).
  - Write ALL code and tests inside your working directory (e.g. ./src, ./tests).
  - "Project Path" = your working directory (.).  "Artifacts Path" = ./.hephaestus/ (create it if missing).
  - Read the design document and prior inputs from ./.hephaestus/ (design.md, context.md, qa_spec.json).
  - Do NOT use absolute paths outside your working directory.
  - ALWAYS use the "Artifacts Path" value for ALL generated docs (.md, .json, .txt).
  - ALWAYS use the "Project Path" value for ALL implementation code.
  - Your task description contains the exact paths — copy them exactly.
  - architecture.md, wherever mentioned in this prompt, means
    architecture-<your Task ID's first 8 hex characters>.md (find your
    Task ID in "Task ID:" above). Not optional: a duplicate/concurrent
    dispatch for this same phase then writes to a DIFFERENT suffixed file
    instead of racing yours, and the pipeline reads your own task's
    suffixed file specifically, not a bare architecture.md.

  Output path: ./.hephaestus/architecture-<your Task ID's first 8 hex characters>.md
  ⚠️  NEVER write to ./.hephaestus/design/ — that subdirectory holds the design queue, NOT generated outputs.
  ⚠️  NEVER write architecture.md anywhere except ./.hephaestus/architecture-<your Task ID's first 8 hex characters>.md.
  
  # Architecture: [Project Name]
  
  ## System Overview
  [High-level description]
  
  ## Components
  ### [Component 1]
  - Purpose: ...
  - Interface: ...
  - Data Model: ...
  - Implementation: ...
  
  ### [Component 2]
  ...
  
  ## Data Flow
  [How data moves through the system]
  
  ## Directory Structure
  ```
  project/
  ├── frontend/
  ├── backend/
  └── ...
  ```
  
  ## Task Breakdown
  ### Infrastructure
  1. [Task] - Blocked By: None
  
  ### Foundation
  2. [Task] - Blocked By: [infrastructure tasks]
  
  ### Features
  3. [Task] - Blocked By: [foundation tasks]
  
  ## Implementation Order
  1. [Component A] → 2. [Component B] → 3. [Component C]
  ...

  ## NEEDS CLARIFICATION
  - [ ] (max 3, priority order: scope > security/privacy > UX > technical
    detail) [question] — omit this section entirely if nothing qualifies

  ## STEP 12: OBJECT-ORIENTED DESIGN PASS
  
  Before finalizing the architecture, perform an OO design pass:
  
  ### Inheritance & Composition
  - Can related components share a base class or interface?
  - Should behavior be composed via containment vs inheritance?
  - Are there Strategy / Template patterns that simplify variants?
  
  ### Single Responsibility
  - Does each class/module do ONE thing well?
  - Can any class be split into smaller, focused units?
  - Are there God objects that need refactoring?
  
  ### Dependency Inversion
  - Do high-level modules depend on abstractions, not concretions?
  - Can we define interfaces/protocols for key boundaries?
  - Are dependencies injected, not hard-coded?
  
  ### Refactoring Opportunities
  - What code is likely to be duplicated? Extract shared utilities.
  - What patterns emerge across components? Create shared abstractions.
  - Where can push-down details (implementation specifics) into subclasses
    while keeping base interfaces clean?
  
  ### Questions to Answer
  1. What are the core abstractions in this system?
  2. Which classes can be refactored to use composition over inheritance?
  3. What interfaces should exist at component boundaries?
  4. What details should be pushed down from base to derived classes?
  5. What shared behavior can be extracted into mixins or utility classes?
  
  Document OO decisions in architecture.md under "Object-Oriented Design".
  
  ## STEP 13: IMPLEMENTATION READINESS PASS (MANDATORY — THE ARCHITECT'S
           CONTRACT WITH THE IMPLEMENTER)
  
  An architecture that requires the implementer to "figure out" details is a
  FAILED architecture. This step forces you to produce a document an
  implementer can follow mechanically — no ambiguity, no "use your judgment",
  no hand-waving.
  
  If you cannot write the signature, you have not finished the design.
  
  ──────────────────────────────────────────────────────────────────────
  STEP 14: CLASS SKELETONS WITH FULL SIGNATURES
  ──────────────────────────────────────────────────────────────────────
  
  For every class in the architecture, write a code skeleton in the
  architecture.md "Object-Oriented Design" section. Minimum content:
  
  ```python
  class AuthService:
      """One-line purpose. Thread-safety contract (e.g. 'Thread-safe.
      All methods may be called concurrently from any thread.')."""
  
      def __init__(self, user_repo: UserRepository, token_encoder: TokenEncoder,
                   config: AuthConfig) -> None:
          """Store deps. Describe any init-time side effects (DB connections,
          background tasks, cache warming)."""
  
      def authenticate(self, credentials: Credentials) -> AuthResult:
          """Validate credentials, return token or raise.
          
          Args:
              credentials: email/password or OAuth token bundle.
          
          Returns:
              AuthResult with access_token, refresh_token, expires_at.
          
          Raises:
              InvalidCredentials: email not found or password mismatch.
              AccountLocked: too many failed attempts (lockout window in config).
              RateLimited: per-IP rate limit exceeded.
          """
  
      def refresh(self, refresh_token: str) -> AuthResult:
          """..."""
  
      async def revoke(self, token: str) -> None:
          """..."""
  ```
  
  Rules:
  - EVERY public method gets a full signature with types and docstring.
  - EVERY custom exception class is listed with its purpose and fields.
  - EVERY data class / Pydantic model / TypedDict is listed with its fields,
    types, and constraints (min/max length, regex, default values).
  - If a method is async, mark it `async`. If it may block, note what it blocks
    on and whether the caller must run it in a thread pool.
  - Return types must be explicit — `-> Result` not `-> Any`.
  
  ──────────────────────────────────────────────────────────────────────
  STEP 15: CONCURRENCY MODEL
  ──────────────────────────────────────────────────────────────────────
  
  For every component, state the concurrency contract explicitly:
  
  - **Thread safety**: Is the class thread-safe? Must callers hold a lock?
    Are there mutable shared fields that need protection?
  - **Async/sync boundary**: Which methods are async? Which block? Where
    must the implementer use `asyncio.to_thread()` or a thread pool?
  - **Shared mutable state**: List every piece of shared state (caches,
    connection pools, in-memory counters) and the synchronization strategy
    (lock, atomic op, per-request isolation, immutable after init).
  - **Race conditions**: Identify known race conditions and the mitigation
    (idempotency key, optimistic locking, mutex, CAS, queue serialization).
  - **Deadlock risk**: If two locks exist, document acquisition order.
  
  If the system is single-threaded or uses a framework that serializes
  access (e.g. SQLite with WAL + single writer), state that explicitly —
  the implementer must not invent concurrency that isn't needed.
  
  ```markdown
  ### Concurrency: AuthService
  - Thread-safe: Yes. Stateless — all mutable state lives in UserRepository.
  - Async: `revoke()` is async (writes to remote token blacklist via HTTP).
    `authenticate()` and `refresh()` are sync (DB + crypto, no I/O wait).
  - Shared state: None. Config is read-only after init.
  - Race condition: Token refresh can race with revocation. Mitigation:
    refresh() checks revocation list AFTER minting new token, revokes old
    token atomically. If check fails, new token is still valid (acceptable
    window: <1s).
  ```
  
  ──────────────────────────────────────────────────────────────────────
  STEP 16: ERROR HIERARCHY AND HANDLING CONTRACT
  ──────────────────────────────────────────────────────────────────────
  
  Define the exception/error hierarchy for the system:
  
  ```python
  # Base exception for the entire system
  class AppError(Exception):
      """Base. All app errors inherit from this."""
      code: str        # machine-readable, e.g. "AUTH_INVALID_CREDENTIALS"
      message: str     # human-readable
      retryable: bool  # can the caller retry?
  
  class AuthError(AppError): ...
  class InvalidCredentials(AuthError): ...
  class AccountLocked(AuthError): ...
  
  class ValidationError(AppError): ...
  class NotFoundError(AppError): ...
  ```
  
  For each component, specify:
  - What exceptions it raises (with the exact class).
  - What exceptions it catches and how (retry? fallback? re-raise wrapped?).
  - What error the API/CLI surface returns to the user (status code, message format).
  
  ──────────────────────────────────────────────────────────────────────
  STEP 17: WIRING AND INITIALIZATION
  ──────────────────────────────────────────────────────────────────────
  
  Describe exactly how components are wired together at startup:
  
  - **Dependency injection**: Is there a DI container, a factory function,
    or manual wiring in `main()`? Show the exact wiring code or pattern.
  - **Initialization order**: What starts first? What depends on what being
    ready? (e.g. "Database must connect before repository is created.
    Cache must warm before service accepts requests.")
  - **Configuration source**: Where does each config value come from?
    Env var? YAML file? CLI flag? Default? List the mapping.
  - **Shutdown/cleanup**: What needs cleanup on exit? Who owns the
    lifecycle? (connection pools, background tasks, temp files)
  
  ```python
  # Example wiring in main()
  config = load_config("config.yaml")
  db = Database(config.db_url)          # connects on init
  user_repo = UserRepository(db)        # uses db session factory
  token_encoder = TokenEncoder(config.jwt_secret)
  auth_service = AuthService(user_repo, token_encoder, config.auth)
  api = create_app(auth_service)        # FastAPI / Flask / CLI app
  ```
  
  ──────────────────────────────────────────────────────────────────────
  STEP 18: GOTCHAS AND IMPLEMENTATION TRAPS
  ──────────────────────────────────────────────────────────────────────
  
  List every non-obvious thing that will bite the implementer. Be
  specific. Include:
  
  - **Framework quirks**: "SQLAlchemy sessions are not thread-safe. Use
    scoped_session or create a session per request."
  - **Library gotchas**: "fastembed's default model outputs 384-dim vectors.
    If you switch models, update the Qdrant collection dimension config."
  - **Ordering dependencies**: "You must create the index BEFORE inserting
    documents, not after."
  - **Silent failure modes**: "If the cache key collides (hash collision),
    you'll serve stale data with no error. Use a content-addressable key."
  - **Performance traps**: "N+1 query pattern: the loop in
    `process_orders()` calls `get_user()` per iteration. Batch it."
  - **Data consistency**: "The `total` column must be updated in the same
    transaction as the line items, not in a separate call."
  - **Testing gotchas**: "Mock the clock, not `time.time()`. The system
    uses `datetime.utcnow()` everywhere — a `time.time()` mock won't
    affect it."
  
  Format as a numbered list in a "Gotchas" subsection under each component.
  If there are system-wide gotchas, put them in a top-level "System Gotchas"
  section.
  
  ──────────────────────────────────────────────────────────────────────
  STEP 19: HOOK-TOGETHER MAP
  ──────────────────────────────────────────────────────────────────────
  
  For every interface boundary between two components, document:
  
  | Caller | Callee | Method | Data Passed | Data Returned | Error Propagation |
  |--------|--------|--------|-------------|---------------|-------------------|
  | API handler | AuthService | authenticate(Credentials) | email, password | AuthResult | InvalidCredentials → 401, AccountLocked → 423 |
  | AuthService | UserRepository | find_by_email(str) | email string | User or None | NotFoundError (internal, not exposed) |
  | Scheduler | TaskRunner | run(Task) | task payload | RunResult | TaskFailed → retry with backoff, max 3 |
  
  This table IS the architecture's contract. If a row is ambiguous, the
  design is not done.
  
  ──────────────────────────────────────────────────────────────────────
  STEP 20: SELF-CHECK: IS THIS ARCHITECTURE IMPLEMENTATION-READY?
  ──────────────────────────────────────────────────────────────────────
  
  Before writing architecture.md, verify:
  
  □ Every public method has a full signature (types, params, return, raises).
  □ Every custom type/model has its fields and constraints listed.
  □ Every component has a concurrency contract.
  □ Every exception in the hierarchy is defined with its fields.
  □ The wiring code (or pattern) is shown.
  □ The initialization order is documented.
  □ Every interface boundary is in the hook-together map.
  □ Gotchas are listed per-component and at system level.
  □ There is no "TBD", "use your judgment", or "as appropriate" anywhere.
  
  If ANY checkbox fails, go back and fill the gap. A design with blanks is
  not a design — it's a wish list.
  
  ## CRITICAL RULES
  
  DO:
  - Read requirements.md thoroughly
  - Design clear component interfaces
  - Create tasks with proper blocking relationships
  - Include detailed acceptance criteria
  - Include code snippets showing key interfaces and data structures
  - Specify logging requirements (levels, context, structured logging)
  - Respect technology choices from Phase 1
  - Perform an OO design pass before finalizing
  - Identify refactoring opportunities and shared abstractions
  - Push down details while keeping base interfaces clean
  - Produce full class skeletons with typed method signatures and docstrings
  - Document the concurrency model for every component (thread safety, async boundaries, shared state, race conditions)
  - Define the exception hierarchy with fields and which component raises what
  - Show the wiring/initialization code or pattern — who creates whom, in what order
  - List gotchas per component: framework quirks, library traps, ordering deps, silent failure modes, performance traps, testing gotchas
  - Fill the hook-together map: every inter-component call with data types and error propagation
  - Pass the self-check: no TBD, no "use your judgment", no blanks
  
  DO NOT:
  - Skip component interface design
  - Create tasks without blocking relationships
  - Forget edge cases in acceptance criteria
  - Ignore non-functional requirements
  - Skip the OO design pass
  - Skip the implementation readiness pass (Steps 12-19)
  - Create tightly coupled components without abstractions
  - Use silent fallbacks that hide configuration errors — throw clear exceptions instead
    (Exception: retry logic, graceful degradation with explicit logging, and user-facing defaults are acceptable)
  - Hardcode values (ports, paths, URLs, timeouts) — put them in config with sensible defaults
  - Leave method signatures incomplete (no `-> Any`, no `*args`, no missing types)
  - Hand-wave concurrency ("should be thread-safe" without saying HOW)
  - Omit exception classes the implementer must define
  - Say "TBD", "as appropriate", "use your judgment", or "follow existing patterns" without specifying WHICH patterns
  - Store credentials, API keys, secrets, or tokens in source code, config files, or architecture.md — ALL secrets go in a .env file (or equivalent secrets manager), never in code or docs. Specify this explicitly in your infrastructure section.
  
  
