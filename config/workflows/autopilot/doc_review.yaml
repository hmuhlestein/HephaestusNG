id: 10
name: doc_review
thinking_level: low
description: |
  Review and fix all project documentation for accuracy, completeness, and quality.
  Produces a feature report, code summary, and doc review findings.
done_definitions:
  - "Stray files organized into Artifacts Path"
  - "Critical inaccuracies fixed"
  - "feature_report.html written to Artifacts Path"
  - "summary.md written to Artifacts Path"
  - "docs.md written to Artifacts Path"
  - "Task marked as done"
outputs:
  - "docs.md"
  - "feature_report.html"
  - "summary.md"
additional_notes: |
  OUTPUT STYLE: Terse. Fragments OK. No filler.

  Your working directory IS the project root. Artifacts Path = ./.hephaestus/ (create if missing).
  ALL reports go in Artifacts Path. Do NOT write into ./docs/ (git-tracked).

  ═══ STEP 1: CLEAN UP ═══

  Move stray .md/.txt/.log files from project root into Artifacts Path (skip README.md, AGENTS.md, etc.). Artifacts Path (./.hephaestus/) is gitignored, so do NOT use `git mv` -- it re-tracks the destination even when it's ignored. Instead: copy the file to the destination, then `git rm <source>` to stage the removal. If `git rm` fails with "did not match any files", the source was never committed -- just `rm <source>`, nothing to stage.

  Sweep ./docs/ for known agent report filenames left there by mistake (stale reports from before the .hephaestus/ migration, or an agent that ignored these instructions): architecture.md, requirements.md, qa.md, validation.md, scope.md, review.md, adversarial.md, forensics.md, docs.md, feature_report.html, summary.md, pipeline_metrics.json, run_health.json, arbitration_result.json. Same copy-then-`git rm` rule as above (never `git mv`), keeping the same relative path if it's under a phase-named subdirectory (e.g. copy docs/qa_validation/qa.md to .hephaestus/qa_validation/qa.md, then `git rm docs/qa_validation/qa.md`). Leave everything else in ./docs/ alone -- it's human-authored project documentation.
  Delete scratch/temp files agents left behind (*_draft*, *_temp*, *.tmp, *.bak, empty dirs).

  ═══ STEP 2: FIX CRITICAL DOC ERRORS ═══

  Read requirements.md (contains REQ-XX requirement IDs), architecture.md,
  the adversarial review report, README.md, and skim key source files. Look for:
  - Forward-looking language now out of date ("will be implemented", "not yet created")
  - Filenames or paths that don't match the actual filesystem
  - Requirements listed as missing that are actually implemented
  - REQ-XX requirements referenced in docs that don't match requirements.md

  Fix critical issues directly. Skip minor style issues.

  ═══ STEP 3: WRITE CODE SUMMARY (summary.md) ═══

  Start summary.md with this frontmatter block, then the content
  immediately after:
  ```
  ---
  type: code_summary
  ---
  ```

  Explore the actual code changes (git diff, read new/modified files) and write
  a standalone summary.md that explains to an engineer:

  - WHAT was built: new files, key classes/functions, what each module does
  - WHY it exists: the problem it solves, design decisions, alternatives considered
  - HOW it works: data flows, error handling, integration patterns, key mechanisms

  Don't just list diffs. Explain the architecture and reasoning so someone can
  form a complete mental model without reading every file.

  ═══ STEP 4: WRITE HTML FEATURE REPORT (feature_report.html) ═══

  Self-contained HTML (inline styles, no external deps).

  Title tag and top-of-page heading must both start with the actual project
  name, not just the feature/design name -- this report gets read out of
  context (downloaded, archived, opened weeks later), and "Feature Report:
  <name>" alone doesn't say which project it's even for. Get the real
  project name with this exact command (works whether you're in the main
  repo or a feature worktree -- do NOT use `git rev-parse --show-toplevel`
  alone for this, it returns the worktree's own path when run from inside
  one, not the project's):

  ```
  basename "$(dirname "$(realpath "$(git rev-parse --git-common-dir)")")"
  ```

  Format: `<title>{Project Name}: Feature Report — {Feature/Design Name}</title>`
  and `<h1>{Project Name}: {Feature/Design Name}</h1>` (or equivalent —
  project name must be visually present in both, not just implied by
  context).

  Include these sections:

  1. Executive Summary — what it does, the problem it solves, status
  2. Architecture — module structure, data flow, dependencies, config
  3. Subsystems — for each: purpose, location, key classes, data model
  4. API Surface — new endpoints/tools with examples
  5. Integration Points — what was modified, migrations, frontend changes
  6. Quality — test coverage, security review, known limitations
  7. Changelog — files created/modified, config changes

  The summary.md content (WHAT/WHY/HOW) should feed into sections 2-3.
  Target 200-400 lines. Enough for someone to understand the feature without
  reading source code.

  ═══ STEP 5: WRITE DOC REVIEW REPORT (docs.md) ═══

  Start docs.md with this frontmatter block, then the content
  immediately after:
  ```
  ---
  type: doc_review_report
  ---
  ```

  Brief: documents reviewed, critical issues fixed, scratch files deleted,
  overall quality rating.

  ═══ MARK DONE ═══

  Call complete_my_task with status="done" and a brief summary.
