default_model: xiaomi/mimo-v2.5
default_thinking_level: low

session_roles:
  product_requirements: product-requirements
  architecture_design: architect
  development: developer
  adversarial_review: architect
  doc_review: doc-reviewer
  security_review: security-reviewer
  qa_validation: qa
  product_validation: product-requirements
  git_commit_push: git
  forensics_analysis: forensics

orchestrator:
  type: evaluating
  max_phase_retries: 2
  max_total_gotos: 30
  evaluation_points:
    - after_phase: architecture_design
      evaluator: heuristic
      max_retries: 2
      conditions:
        - if: "score < 0.4"
          action: goto
          target: product_requirements
          reason: "Architecture fundamentally flawed, re-examine requirements"
        - if: "score < 0.6"
          action: retry
          reason: "Architecture needs improvement"
        - if: "score >= 0.6"
          action: continue
          reason: "Architecture approved"

    - after_phase: development
      evaluator: heuristic
      max_retries: 0
      conditions:
        - if: "score >= 0.0"
          action: continue
          reason: "Development complete, proceeding to review"

    - after_phase: adversarial_review
      evaluator: heuristic
      max_retries: 15
      conditions:
        - if: "score < 0.3"
          action: goto
          target: architecture_design
          reason: "Major architectural issues found, returning to architecture"
        - if: "score < 0.6"
          action: goto
          target: development
          reason: "Code issues found, returning to development"
        - if: "score >= 0.6"
          action: continue
          reason: "Adversarial review passed"

    - after_phase: doc_review
      evaluator: heuristic
      max_retries: 2
      conditions:
        - if: "score < 0.3"
          action: goto
          target: architecture_design
          reason: "Documentation gaps indicate architectural issues"
        - if: "score < 0.6"
          action: goto
          target: development
          reason: "Documentation needs code-level fixes"
        - if: "score >= 0.6"
          action: continue
          reason: "Documentation approved"

    - after_phase: security_review
      evaluator: heuristic
      max_retries: 2
      conditions:
        - if: "score < 0.3"
          action: goto
          target: architecture_design
          reason: "Security issues require architectural changes"
        - if: "score < 0.7"
          action: goto
          target: development
          reason: "Security issues found, returning to development"
        - if: "score >= 0.7"
          action: continue
          reason: "Security review passed"

    - after_phase: qa_validation
      evaluator: heuristic
      max_retries: 2
      conditions:
        - if: "score < 0.3"
          action: goto
          target: architecture_design
          reason: "Test failures indicate architectural problems"
        - if: "score < 0.7"
          action: goto
          target: development
          reason: "QA failed, returning to development"
        - if: "score >= 0.7"
          action: continue
          reason: "QA passed"

    - after_phase: product_validation
      evaluator: heuristic
      max_retries: 2
      conditions:
        - if: "score < 0.3"
          action: goto
          target: architecture_design
          reason: "Product validation failed, needs architectural review"
        - if: "score < 0.7"
          action: goto
          target: development
          reason: "Product validation failed, returning to development"
        - if: "score >= 0.7"
          action: continue
          reason: "Product validated, proceeding to commit"

    - after_phase: forensics_analysis
      evaluator: heuristic
      max_retries: 0
      conditions:
        - if: "score >= 0.0"
          action: continue
          reason: "Forensics complete, proceeding to commit"

    - after_phase: git_commit_push
      evaluator: heuristic
      max_retries: 0
      conditions:
        - if: "score >= 0.0"
          action: continue
          reason: "Git commit complete"

workflow:
  result_criteria: "Feature validated and committed to git, ready for human review"
  on_result_found: do_nothing
  enable_tickets: true
  board:
    columns:
      - id: backlog
        name: Backlog
        order: 1
        color: "#94a3b8"
      - id: requirements
        name: Requirements
        order: 2
        color: "#3b82f6"
      - id: architecture
        name: Architecture
        order: 3
        color: "#8b5cf6"
      - id: in-progress
        name: In Progress
        order: 4
        color: "#f59e0b"
      - id: review
        name: In Review
        order: 5
        color: "#ec4899"
      - id: doc-review
        name: Doc Review
        order: 6
        color: "#06b6d4"
      - id: security
        name: Security
        order: 7
        color: "#ef4444"
      - id: qa
        name: QA
        order: 8
        color: "#14b8a6"
      - id: validated
        name: Validated
        order: 9
        color: "#22c55e"
      - id: shipped
        name: Shipped
        order: 10
        color: "#3b82f6"
    ticket_types:
      - infrastructure
      - feature
      - bug-fix
      - security
      - integration
      - documentation
    default_ticket_type: feature
    initial_status: backlog
    auto_assign: true
    require_comments_on_status_change: true
    allow_reopen: true
    track_time: true

launch_template:
  parameters:
    - name: design_document
      label: Design Document Path
      type: text
      required: true
      description: "Path to the design document (PRD, DESIGN.md, etc.)"
    - name: project_path
      label: Project Working Directory
      type: text
      required: true
      description: "Where to build the feature"
    - name: project_context
      label: Project Context (Optional)
      type: textarea
      required: false
      description: "Optional: Additional context about the larger project vision"
