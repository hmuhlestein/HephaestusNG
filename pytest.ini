[pytest]
# --cov is deliberately NOT a default addopt: CLAUDE.md documents
# `pytest tests/test_foo.py` (single file, no coverage) and
# `pytest --cov=src` (coverage) as two separate commands. Baking --cov
# into every invocation made a single-file run with all tests passing
# still exit non-zero because .coveragerc's fail_under=20 is measured
# against the whole src/ tree, not the file under test -- breaking the
# documented single-file workflow (and the project's own guidance to run
# only touched-file tests, not full-suite coverage, by default).
addopts = -p no:libtmux

# pyproject.toml's [tool.pytest.ini_options] declares this, but a pytest.ini
# in the same tree shadows that section ENTIRELY -- so the declaration there
# was dead and unmarked `async def test_*` functions were silently collected
# as non-async and failed. Measured: tests/test_mcp_server.py goes 7 failed
# -> 7 passed with this line present.
asyncio_mode = auto

# Only this repo's own suite. lib/ holds vendored third-party source
# (lib/fastembed/tests/) whose tests import under their own package layout
# and fail to collect here -- twelve collection errors that abort the run
# before any of our tests execute. .worktrees/ holds agent worktrees, each
# with a full copy of tests/, which collide on module name.
#
# testpaths covers a bare `pytest`; norecursedirs also covers an explicit
# `pytest .`. norecursedirs REPLACES pytest's defaults rather than extending
# them, so the stock entries (notably `.*`, which is what skips .worktrees)
# are repeated here -- dropping them silently re-enables those directories.
testpaths = tests
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} lib frontend
