server:
  host: 0.0.0.0
  port: 8300
  frontend_port: 5300
  enable_cors: true
paths:
  database: ./hephaestus.db
  # project_root: defaults to current working directory
git:
  # main_repo_path: defaults to current working directory
  worktree_branch_prefix: agent-
  auto_commit: true
  conflict_resolution: newest_file_wins
llm:
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_provider: fastembed
  default_provider: openrouter
  default_model: xiaomi/mimo-v2.5
  default_temperature: 0.7
  default_max_tokens: 4000

  # LiteLLM Proxy (optional - routes through deneb-server for cost tracking)
  # When enabled, all LLM calls go through LiteLLM proxy with a custom "user"
  # field set to the feature name, enabling per-feature cost tracking.
  # litellm_proxy:
  #   url: http://deneb-server:4000
  #   api_key_env: LITELLM_API_KEY        # Virtual key for proxy authentication
  #   cost_api_key_env: LITELLM_MASTER_KEY # Admin key for querying spend endpoints
  #   cost_tracking: true                  # Enable per-feature cost tracking

  providers:
    openai:
      api_key_env: OPENAI_API_KEY
    openrouter:
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
    groq:
      api_key_env: GROQ_API_KEY
  model_assignments:
    # Utility/orchestration calls — mechanical structured work, not deep reasoning.
    # reasoning_effort caps mimo's reasoning stream (the real slowness); max_tokens
    # bounds the answer. Was: all on mimo, full reasoning, 4-8k tokens, ~7 min/call.
    task_enrichment:
      provider: openrouter
      model: xiaomi/mimo-v2.5
      temperature: 0.3
      max_tokens: 1500
      reasoning_effort: low
    agent_monitoring:
      provider: openrouter
      model: xiaomi/mimo-v2.5
      temperature: 0.2
      max_tokens: 1000
      reasoning_effort: low
    guardian_analysis:
      provider: openrouter
      model: xiaomi/mimo-v2.5
      temperature: 0.3
      max_tokens: 1200
      reasoning_effort: "off"   # mimo over-streams structured calls (5-min then parse-fail); disable reasoning. 90s timeout in guardian.py is the hard backstop.
    conductor_analysis:
      provider: openrouter
      model: xiaomi/mimo-v2.5
      temperature: 0.3
      max_tokens: 1500
      reasoning_effort: low
    agent_prompts:
      provider: openrouter
      model: xiaomi/mimo-v2.5
      temperature: 0.6
      max_tokens: 2000
      reasoning_effort: low
agents:
  default_cli_tool: pi
  cli_model: Qwen3.6-27B-UD-Q4_K_XL.gguf
  default_fallback_cli_tool: pi
  default_fallback_cli_model: openrouter/xiaomi/mimo-v2.5-pro
  cli_model_fallback_wait_seconds: 120
  cli_model_fallback: openrouter/xiaomi/mimo-v2.5-pro
  secondary_cli_model_fallback: sonnet
  # The local Qwen model has only a single inference slot -- a second agent
  # dispatched onto it just sits frozen waiting its turn instead of doing
  # anything. Cap it at 1; the queue then dispatches the second task on
  # cli_model_fallback (mimo-v2.5-pro, above) instead of stalling it.
  cli_model_concurrency_limits:
    "pi/Qwen3.6-27B-UD-Q4_K_XL.gguf": 1
  tmux_session_prefix: agent
  health_check_interval: 60
  max_health_failures: 3
  termination_delay: 5
vector_store:
  backend: turbovec
  collection_prefix: hephaestus
  embedding_dimension: 384
  # turbovec settings (default - no Docker required)
  turbovec_data_dir: data/turbovec
  # qdrant settings (optional - requires Docker, set VECTOR_STORE_BACKEND=qdrant)
  # qdrant_url: http://localhost:6333
monitoring:
  enabled: true
  interval_seconds: 60
  log_level: INFO
  log_format: json
  stuck_agent_threshold: 300
  guardian_min_agent_age_seconds: 60
  max_ignored_steering: 3
mcp:
  # SECURITY: auth_required should be true in production. Set to false only for
  # local development/debugging. When true, endpoints require valid X-Agent-ID header.
  auth_required: false  # TODO: Set to true before production deployment
  session_timeout: 3600
  max_concurrent_agents: 6
task_deduplication:
  enabled: true
  similarity_threshold: 0.999
  related_threshold: 0.5
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_dimension: 384
  embedding_backend: fastembed
  batch_size: 100
diagnostic_agent:
  enabled: true
  cooldown_seconds: 60
  min_stuck_time_seconds: 60
  max_agents_to_analyze: 15
  max_conductor_analyses: 5
  max_tasks_per_run: 5
autopilot:
  # Timeout for a single workflow execution (default: 7200 = 2 hours)
  workflow_timeout_seconds: 7200
  # Timeout for Phase 0 runs (default: 3600 = 1 hour)
  phase0_timeout_seconds: 3600
  # Max number of projects the autopilot pipeline can run concurrently
  max_concurrent_projects: 2
  # Wait between auto-retry attempts on a workflow paused for exhausted
  # retries (e.g. after topping up API credits)
  paused_workflow_retry_cooldown_seconds: 300
  # Give up permanently (requires manual resume) after this many auto-retry cycles
  paused_workflow_max_retry_cycles: 10
ticket_tracking:
  enabled: true
  default_human_review: false
  default_approval_timeout: 1800
  embedding:
    model: BAAI/bge-small-en-v1.5
    dimensions: 384
    backend: fastembed

monitoring:
  # Minutes of inactivity before an agent is considered stuck
  stuck_detection_minutes: 15
  # Minutes before a guardian nudge is sent
  guardian_nudge_delay_minutes: 10
