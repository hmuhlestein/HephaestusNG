server:
  host: 0.0.0.0
  port: 8300
  frontend_port: 5300
  enable_cors: true
paths:
  database: ./hephaestus.db
  # project_root: defaults to current working directory
git:
  # main_repo_path: defaults to current working directory
  branch_prefix: agent-
  auto_commit: true
  # allow_local_merge_fallback: default false. When a review-approved
  # feature's PR can't be merged via `gh pr merge` (a real conflict, or a
  # required check that hasn't passed), the approval flow can fall back to
  # merging locally and pushing directly to main -- which bypasses the
  # same branch protection a failed required check represents. Leave this
  # off unless you understand and accept that tradeoff; a stuck PR is left
  # open for manual handling instead.
  # allow_local_merge_fallback: false
llm:
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_provider: fastembed
  default_provider: claude_cli
  default_model: sonnet
  default_temperature: 0.7
  default_max_tokens: 4000

  # LiteLLM Proxy (optional - routes through deneb-server for cost tracking)
  # When enabled, all LLM calls go through LiteLLM proxy with a custom "user"
  # field set to the feature name, enabling per-feature cost tracking.
  # litellm_proxy:
  #   url: http://deneb-server:4000
  #   api_key_env: LITELLM_API_KEY        # Virtual key for proxy authentication
  #   cost_api_key_env: LITELLM_MASTER_KEY # Admin key for querying spend endpoints
  #   cost_tracking: true                  # Enable per-feature cost tracking

  providers:
    openai:
      api_key_env: OPENAI_API_KEY
    openrouter:
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
    groq:
      api_key_env: GROQ_API_KEY
    claude_cli:
      # No API key required -- routes through the locally authenticated
      # Claude Code CLI (`claude -p --model ...`), billed against the
      # existing Claude subscription instead of a metered API key.
      api_key_env: CLAUDE_CLI_UNUSED
  # provider: claude_cli below routes through the local Claude Code CLI --
  # temperature/max_tokens are ignored for it; reasoning_effort maps to the
  # CLI's --effort flag (low/medium/high/xhigh/max), default "high" here.
  # OpenRouter remains available as an alternative: set provider: openrouter
  # and model: e.g. xiaomi/mimo-v2.5 (see providers.openrouter above) on any
  # component below to route it through a metered API key instead.
  model_assignments:
    task_enrichment:
      provider: claude_cli
      model: sonnet
      reasoning_effort: high
    agent_monitoring:
      provider: claude_cli
      model: sonnet
      reasoning_effort: high
    guardian_analysis:
      provider: claude_cli
      model: sonnet
      reasoning_effort: high
    conductor_analysis:
      provider: claude_cli
      model: sonnet
      reasoning_effort: high
    agent_prompts:
      provider: claude_cli
      model: sonnet
      reasoning_effort: high
agents:
  default_cli_tool: claude
  cli_model: sonnet
  # pi removed as the secondary/fallback CLI tool. Both keys read via
  # Config.get(...), which returns None for an absent/commented key --
  # every call site (launch_pipeline.py, mechanical_recovery.py,
  # phase_transitions.py, schema_migrations.py) already guards on
  # `if cfg.agents.default_fallback_cli_tool:`, so leaving these unset
  # cleanly disables the CLI-tool-level fallback/escalation path rather
  # than erroring. Set both to re-enable with a different tool.
  # default_fallback_cli_tool:
  # default_fallback_cli_model:
  cli_model_fallback_wait_seconds: 120
  # cli_model_fallback/secondary_cli_model_fallback feed CLIAgentInterface.
  # fallback_model's in-session "agent is frozen, switch models" recovery --
  # a different mechanism from default_fallback_cli_tool/_model above
  # (which tears down and relaunches under a different CLI entirely). This
  # pair is resolved by ROLE (primary vs secondary tier), not by which CLI
  # product is running: cli_model_fallback is whichever CLI is currently
  # default_cli_tool's own in-session escalation target; secondary_cli_model_
  # fallback is default_fallback_cli_tool's. Each value must be one that
  # CLI's own model vocabulary actually understands -- an OpenRouter path
  # fed to Claude Code's `/model` picker (or a Claude alias fed to pi's,
  # which resolves bare aliases like "sonnet" via amazon-bedrock, unconfigured
  # here) fails immediately with no usable credentials. Confirmed live: task
  # a4863f19 lost ~10 minutes to exactly this mismatch before this fix.
  # secondary_cli_model_fallback was pi's own in-session escalation target
  # (Qwen served locally through pi) -- vestigial now that
  # default_fallback_cli_tool above is unset. Re-add alongside it if a
  # secondary tier comes back.
  # secondary_cli_model_fallback: Qwen3.8-27B-UD-Q4_K_XL.gguf
  # The local Qwen model has only a single inference slot -- a second agent
  # dispatched onto it just sits frozen waiting its turn instead of doing
  # anything. Cap it at 1 so the queue's concurrency gate (resolve_fallback_
  # model, same role-based lookup as fallback_model above) won't pile a
  # second dispatch onto it.
  cli_model_concurrency_limits:
    # "pi/Qwen3.8-27B-UD-Q4_K_XL.gguf": 1
  tmux_session_prefix: agent
  health_check_interval: 60
  max_health_failures: 3
  termination_delay: 5
vector_store:
  backend: turbovec
  collection_prefix: hephaestus
  embedding_dimension: 384
  # turbovec settings (default - no Docker required)
  turbovec_data_dir: data/turbovec
  # qdrant settings (optional - requires Docker, set VECTOR_STORE_BACKEND=qdrant)
  # qdrant_url: http://localhost:6333
monitoring:
  enabled: true
  interval_seconds: 60
  log_level: INFO
  log_format: json
  stuck_agent_threshold: 300
  guardian_min_agent_age_seconds: 60
  max_ignored_steering: 3
  # How long a task may sit "assigned" with no agent before the stale-task
  # sweep puts it back on the queue. Must comfortably exceed a normal
  # dequeue->dispatch window (LLM enrichment + agent launch), or the sweep
  # races an in-flight dispatch and double-dispatches the task.
  stranded_task_grace_seconds: 900
  # Minutes of inactivity before an agent is considered stuck
  # Be patient - agents can be working for a long time before producing output
  stuck_detection_minutes: 30
  # Minutes before a guardian nudge is sent
  guardian_nudge_delay_minutes: 15
  # Max nudges before considering agent stuck
  max_stuck_nudges: 5
mcp:
  # SECURITY: auth_required should be true in production. Set to false only for
  # local development/debugging. When true, endpoints require valid X-Agent-ID header.
  auth_required: false  # TODO: Set to true before production deployment
  session_timeout: 3600
  max_concurrent_agents: 6
task_deduplication:
  enabled: true
  similarity_threshold: 0.999
  related_threshold: 0.5
  embedding_model: BAAI/bge-small-en-v1.5
  embedding_dimension: 384
  embedding_backend: fastembed
  batch_size: 100
diagnostic_agent:
  enabled: true
  cooldown_seconds: 60
  min_stuck_time_seconds: 60
  max_agents_to_analyze: 15
  max_conductor_analyses: 5
  max_tasks_per_run: 5
autopilot:
  # Timeout for a single workflow execution (default: 7200 = 2 hours)
  workflow_timeout_seconds: 7200
  # Timeout for Phase 0 runs (default: 3600 = 1 hour)
  phase0_timeout_seconds: 3600
  # Max number of projects the autopilot pipeline can run concurrently
  max_concurrent_projects: 2
  # Wait between auto-retry attempts on a workflow paused for exhausted
  # retries (e.g. after topping up API credits)
  paused_workflow_retry_cooldown_seconds: 300
  # Give up permanently (requires manual resume) after this many auto-retry cycles
  paused_workflow_max_retry_cycles: 10
  # How long sdk.start() waits for the backend's /health check when
  # launching the autopilot pipeline
  sdk_start_timeout_seconds: 60
  # How long the QA gate's own independent pytest re-run may block phase
  # advancement before giving up and falling back to the agent's
  # self-reported result. Raise this if the target project's test suite
  # routinely runs close to the ceiling.
  independent_test_timeout_seconds: 300
ticket_tracking:
  enabled: true
  default_human_review: false
  default_approval_timeout: 1800
  embedding:
    model: BAAI/bge-small-en-v1.5
    dimensions: 384
    backend: fastembed
testing:
  # Minimum overall coverage percentage (existing + new code combined).
  # Applied via pytest-cov's --cov-fail-under.  20 % is a starter floor --
  # raise it as coverage improves.
  coverage_floor: 20
  # Minimum coverage for lines changed in the current diff (vs. origin/main).
  # Enforced by scripts/check_coverage.py via diff-cover.  80 % is the real
  # bar -- every NEW line should be tested.
  new_code_coverage_floor: 80

