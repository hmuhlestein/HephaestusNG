name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Off by default. Every push touching website/ used to run this, and a
    # failing run emails the repo owner via GitHub's Actions notifications
    # -- which are a per-ACCOUNT setting (github.com/settings/notifications),
    # not something this repo can switch off. What the repo can control is
    # whether the run happens at all, so the automatic trigger is gated here.
    #
    # To turn automatic deploys back on, set the repository variable
    # DEPLOY_DOCS to "true":
    #   gh variable set DEPLOY_DOCS --body true
    #   (or Settings -> Secrets and variables -> Actions -> Variables)
    #
    # Manual runs (workflow_dispatch) ALWAYS work regardless, so the docs
    # can still be published on demand without flipping the variable.
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_DOCS == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
